<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#996CAC">
<title>정보처리기사 · 출퇴근 노선</title>
<style>
:root{
  --line:#996CAC;
  --ink:#0E1116;
  --ink-2:#161B22;
  --ink-3:#1E252F;
  --paper:#F2F4F7;
  --mute:#8B95A5;
  --ok:#39C07C;
  --no:#F2584D;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:16px;line-height:1.6;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
code,.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

.rail{position:sticky;top:0;z-index:20;background:linear-gradient(var(--ink) 78%,rgba(14,17,22,0));padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
.rail-top{display:flex;align-items:center;gap:10px}
.badge{width:30px;height:30px;flex:none;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.02em}
.subject{font-size:15px;font-weight:700;letter-spacing:-.02em;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subject small{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{margin-left:auto;text-align:right;flex:none;padding-left:8px}
.counter b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.counter span{font-size:11px;color:var(--mute);display:block;margin-top:-2px}

.track{margin-top:14px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.stations{display:flex;align-items:center;gap:0;height:22px;padding-right:20px}
.st{flex:none;display:flex;align-items:center}
.st i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-3);border:2px solid var(--ink-3);transition:background .2s,border-color .2s,transform .2s}
.st b{width:14px;height:2px;background:var(--ink-3);flex:none}
.st.pass i{background:var(--line);border-color:var(--line)}
.st.pass b{background:var(--line)}
.st.fail i{background:transparent;border-color:var(--no)}
.st.fail b{background:var(--ink-3)}
.st.now i{transform:scale(1.7);background:var(--paper);border-color:var(--paper)}

main{flex:1;padding:6px 18px 20px;max-width:640px;width:100%;margin:0 auto}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--line);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);border-radius:999px;padding:3px 10px;margin-bottom:14px}
.q{font-size:23px;line-height:1.45;font-weight:800;letter-spacing:-.035em;margin:0 0 22px;word-break:keep-all}
.q code{font-size:.92em;font-weight:700;background:var(--ink-3);padding:2px 7px;border-radius:6px;letter-spacing:0}

.choices{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:58px;padding:15px 16px;background:var(--ink-2);border:1.5px solid var(--ink-3);border-radius:var(--r);color:var(--paper);font:inherit;font-size:15.5px;line-height:1.45;text-align:left;letter-spacing:-.02em;word-break:keep-all;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}
.opt kbd{flex:none;width:22px;height:22px;margin-top:1px;border-radius:6px;background:var(--ink-3);color:var(--mute);display:grid;place-items:center;font:700 12px/1 ui-monospace,monospace}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--ink-2))}
.opt.right kbd{background:var(--ok);color:#06110B}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 13%,var(--ink-2))}
.opt.wrong kbd{background:var(--no);color:#2A0906}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}

.ox{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ox .opt{justify-content:center;align-items:center;min-height:104px;font-size:38px;font-weight:800;padding:0}
.ox .opt kbd{display:none}

.verdict{margin-top:18px;border-radius:var(--r);padding:16px 17px;background:var(--ink-2);border-left:4px solid var(--mute)}
.verdict.ok{border-left-color:var(--ok)}
.verdict.no{border-left-color:var(--no)}
.verdict h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.02em}
.verdict.ok h3{color:var(--ok)}
.verdict.no h3{color:var(--no)}
.verdict p{margin:0;font-size:14.5px;line-height:1.65;color:#C9D2DE;word-break:keep-all}
.verdict code{background:var(--ink-3);padding:1px 6px;border-radius:5px;font-size:.92em}

footer{position:sticky;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(14,17,22,0),var(--ink) 30%);max-width:640px;width:100%;margin:0 auto}
.next{width:100%;min-height:56px;border:0;border-radius:var(--r);background:var(--line);color:#fff;font:800 17px/1 inherit;letter-spacing:-.02em;cursor:pointer;transition:opacity .15s,transform .1s}
.next:active{transform:scale(.99)}
.next:disabled{opacity:.22;cursor:default}
.next:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}
.hint{text-align:center;font-size:11.5px;color:var(--mute);margin-top:9px;letter-spacing:-.01em}

.end{padding:10px 0 0}
.score{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.score b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:17px;color:var(--mute);font-weight:600}
.end>p{color:var(--mute);font-size:14px;margin:0 0 22px}

.cycle{background:var(--ink-2);border-radius:var(--r);padding:15px 16px;margin-bottom:26px}
.cycle-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.cycle-top b{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.cycle-top span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--line);border-radius:3px;transition:width .5s}
.cycle small{display:block;margin-top:9px;font-size:11.5px;color:var(--mute);line-height:1.5}

.end h2{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--mute);margin:0 0 12px}
.miss{background:var(--ink-2);border-radius:var(--r);padding:15px 16px;margin-bottom:9px;border-left:4px solid var(--no)}
.miss h4{margin:0 0 7px;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.45;word-break:keep-all}
.miss p{margin:0;font-size:13.5px;color:#B4BEC9;line-height:1.6;word-break:keep-all}
.miss p b{color:var(--ok);font-weight:700}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.ghost{width:100%;min-height:52px;border-radius:var(--r);background:transparent;border:1.5px solid var(--ink-3);color:var(--paper);font:700 15.5px/1 inherit;cursor:pointer}
.ghost:active{background:var(--ink-2)}
.ghost:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}
.ghost.quiet{color:var(--mute);border-color:transparent;min-height:44px;font-size:13.5px;font-weight:600}
.ghost.linkbtn{display:grid;place-items:center;text-decoration:none;line-height:1}

/* 관리자 초기화 */
.admin,.home{
  width:30px;height:30px;flex:none;
  border:1.5px solid var(--ink-3);border-radius:9px;
  background:transparent;color:var(--mute);
  display:grid;place-items:center;cursor:pointer;padding:0;
  text-decoration:none;
}
.home{margin-left:8px}
.admin{margin-left:6px}
.admin:active,.home:active{background:var(--ink-2)}
.admin:focus-visible,.home:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}
.admin svg,.home svg{width:15px;height:15px;display:block}

.mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(6,8,11,.72);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:22px;
}
.mask[hidden]{display:none}
.modal{
  width:100%;max-width:340px;
  background:var(--ink-2);border:1px solid var(--ink-3);border-radius:18px;
  padding:22px 20px 18px;
}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.03em}
.modal p{margin:0 0 16px;font-size:13.5px;color:var(--mute);line-height:1.55;word-break:keep-all}
.pin{
  width:100%;height:54px;margin-bottom:10px;
  background:var(--ink);border:1.5px solid var(--ink-3);border-radius:var(--r);
  color:var(--paper);font:800 24px/1 ui-monospace,monospace;
  text-align:center;letter-spacing:.5em;text-indent:.5em;
}
.pin:focus{outline:none;border-color:var(--line)}
.pin.shake{border-color:var(--no);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.warn{min-height:18px;margin:0 0 12px;font-size:12.5px;color:var(--no);text-align:center}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;min-height:48px;border-radius:var(--r);font:700 15px/1 inherit;cursor:pointer;border:0}
.btn-no{background:transparent;border:1.5px solid var(--ink-3);color:var(--paper)}
.btn-yes{background:var(--no);color:#fff;font-weight:800}
.modal-btns button:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){.q{font-size:26px}}
</style>
</head>
<body>

<header class="rail">
  <div class="rail-top">
    <div class="badge">5</div>
    <div class="subject">정보처리기사<small>필기 핵심 개념 정리</small></div>
    <div class="counter"><b id="cnt">0/0</b><span id="streak">연속 0</span></div>
    <a class="home" href="index.html" aria-label="노선 목록으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V20h14V9.7"/>
      </svg>
    </a>
    <button class="admin" id="admin" type="button" aria-label="진행 기록 초기화">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>
  <div class="track"><div class="stations" id="stations"></div></div>
</header>

<div class="mask" id="mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">진행 기록 초기화</h3>
    <p>지금까지 푼 기록을 지우고 100문항 전체에서 다시 무작위로 출제합니다.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••">
    <p class="warn" id="warn"></p>
    <div class="modal-btns">
      <button class="btn-no" id="cancel" type="button">취소</button>
      <button class="btn-yes" id="confirm" type="button">초기화</button>
    </div>
  </div>
</div>

<main id="stage"><noscript><div style="background:#161B22;border-left:4px solid #F2584D;border-radius:14px;padding:16px 17px;margin-top:10px"><h3 style="margin:0 0 6px;font-size:14px;color:#F2584D">자바스크립트가 실행되지 않았어요</h3><p style="margin:0;font-size:14px;color:#C9D2DE;line-height:1.6;word-break:keep-all">아이폰 파일 앱의 미리보기(Quick Look)로 열면 이 화면이 나옵니다. 파일에는 문제가 없으니, 실제 브라우저로 열거나 웹에 올려서 접속해 주세요.</p></div></noscript></main>

<footer id="foot">
  <button class="next" id="next" disabled>답을 고르세요</button>
  <div class="hint" id="hint">숫자키·O·X로 선택, Enter로 다음</div>
</footer>

<script>
const BANK = [
{
"tag": "소프트웨어 설계",
"type": "choice",
"q": "응집도와 결합도의 바람직한 방향은?",
"options": [
"응집도는 높게, 결합도는 낮게",
"응집도는 낮게, 결합도는 높게",
"둘 다 높게",
"둘 다 낮게"
],
"a": 0,
"why": "한 모듈 안의 요소들은 서로 밀접해야(높은 응집도) 하고, 모듈 사이는 느슨해야(낮은 결합도) 변경 여파가 퍼지지 않습니다. 시험 단골이에요."
},
{
"tag": "소프트웨어 설계",
"type": "choice",
"q": "응집도가 가장 강한 유형은?",
"options": [
"기능적 응집도",
"논리적 응집도",
"시간적 응집도",
"우연적 응집도"
],
"a": 0,
"why": "강한 순서는 기능적 &gt; 순차적 &gt; 교환(통신)적 &gt; 절차적 &gt; 시간적 &gt; 논리적 &gt; 우연적입니다. '기순교절시논우'로 외웁니다."
},
{
"tag": "소프트웨어 설계",
"type": "choice",
"q": "결합도가 가장 약한(좋은) 유형은?",
"options": [
"자료 결합도",
"내용 결합도",
"공통 결합도",
"제어 결합도"
],
"a": 0,
"why": "약한 순서는 자료 &gt; 스탬프 &gt; 제어 &gt; 외부 &gt; 공통 &gt; 내용입니다. '자스제외공내'로 외우고, 내용 결합도가 최악이라고 기억하세요."
},
{
"tag": "디자인 패턴",
"type": "choice",
"q": "싱글톤(Singleton) 패턴의 목적은?",
"options": [
"클래스의 인스턴스를 하나만 만들어 전역에서 공유",
"객체 생성을 서브클래스에 위임",
"여러 객체에 변경을 통지",
"인터페이스를 변환"
],
"a": 0,
"why": "생성 패턴에 속합니다. 스프링 빈의 기본 스코프도 싱글톤이죠. 다만 전역 상태를 만들기 쉬워 남용하면 테스트가 어려워집니다."
},
{
"tag": "디자인 패턴",
"type": "choice",
"q": "어떤 객체의 상태 변화를 여러 객체에 자동으로 알리는 패턴은?",
"options": [
"옵서버(Observer)",
"전략(Strategy)",
"팩토리 메서드(Factory Method)",
"어댑터(Adapter)"
],
"a": 0,
"why": "발행-구독 구조입니다. 행위 패턴에 속하고, 이벤트 리스너가 대표적인 구현이에요."
},
{
"tag": "디자인 패턴",
"type": "choice",
"q": "알고리즘을 캡슐화해 런타임에 교체할 수 있게 하는 패턴은?",
"options": [
"전략(Strategy)",
"싱글톤(Singleton)",
"프록시(Proxy)",
"데코레이터(Decorator)"
],
"a": 0,
"why": "결제 수단이나 정렬 방식을 인터페이스로 추상화해 갈아끼우는 방식입니다. if-else 분기를 없애는 데 자주 쓰여요."
},
{
"tag": "디자인 패턴",
"type": "choice",
"q": "GoF 디자인 패턴의 세 가지 분류는?",
"options": [
"생성 · 구조 · 행위",
"생성 · 소멸 · 변경",
"입력 · 처리 · 출력",
"설계 · 구현 · 테스트"
],
"a": 0,
"why": "생성 패턴은 객체 생성, 구조 패턴은 객체 조합, 행위 패턴은 객체 간 상호작용을 다룹니다. 총 23개예요."
},
{
"tag": "디자인 패턴",
"type": "choice",
"q": "호환되지 않는 인터페이스를 연결해주는 패턴은?",
"options": [
"어댑터(Adapter)",
"브리지(Bridge)",
"퍼사드(Facade)",
"컴포지트(Composite)"
],
"a": 0,
"why": "구조 패턴입니다. 기존 코드를 수정하지 않고 감싸서 다른 인터페이스로 맞춰줍니다. 퍼사드는 복잡한 서브시스템을 단순한 창구 하나로 감싸는 패턴이에요."
},
{
"tag": "UML",
"type": "choice",
"q": "UML 다이어그램 중 시간 흐름에 따른 객체 간 메시지 교환을 표현하는 것은?",
"options": [
"시퀀스 다이어그램",
"클래스 다이어그램",
"유스케이스 다이어그램",
"배치 다이어그램"
],
"a": 0,
"why": "동적(행위) 다이어그램입니다. 클래스 다이어그램은 정적 구조, 유스케이스는 사용자와 시스템의 상호작용을 나타내요."
},
{
"tag": "UML",
"type": "choice",
"q": "UML의 관계 중 '전체와 부분이 생명주기를 함께하는' 강한 포함 관계는?",
"options": [
"컴포지션(Composition)",
"애그리게이션(Aggregation)",
"연관(Association)",
"의존(Dependency)"
],
"a": 0,
"why": "컴포지션은 전체가 사라지면 부분도 사라집니다(속이 찬 마름모). 애그리게이션은 부분이 독립적으로 존재할 수 있어요(빈 마름모)."
},
{
"tag": "데이터베이스",
"type": "choice",
"q": "트랜잭션의 ACID 특성이 아닌 것은?",
"options": [
"병렬성(Concurrency)",
"원자성(Atomicity)",
"일관성(Consistency)",
"지속성(Durability)"
],
"a": 0,
"why": "ACID는 원자성·일관성·격리성(Isolation)·지속성입니다. 원자성은 전부 되거나 전부 안 되거나, 지속성은 커밋된 결과가 영구히 남는 것이에요."
},
{

const KEY = 'quiz.gisa';
const SIZE = 20;

/* 저장소 — 로컬스토리지가 막힌 환경에서는 메모리로 자동 대체 */
const mem = {};
const store = {
  ok: (() => { try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  read() {
    try {
      const raw = this.ok ? localStorage.getItem(KEY) : mem[KEY];
      const d = raw ? JSON.parse(raw) : null;
      if (d && Array.isArray(d.seen) && typeof d.cycle === 'number') return d;
    } catch (e) {}
    return { seen: [], cycle: 1 };
  },
  write(d) {
    try {
      const raw = JSON.stringify(d);
      if (this.ok) localStorage.setItem(KEY, raw); else mem[KEY] = raw;
    } catch (e) {}
  },
  clear() {
    try { if (this.ok) localStorage.removeItem(KEY); else delete mem[KEY]; } catch (e) {}
  }
};

const $ = id => document.getElementById(id);
const stage = $('stage'), foot = $('foot'), nextBtn = $('next'), hint = $('hint');
const toTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

let deck = [], idx = 0, score = 0, streak = 0, best = 0, misses = [], locked = false, cur = null;
let state = store.read(), lastOfCycle = false, startedCycle = 1;

/* 이번 세션에 낼 문제 뽑기 — 한 바퀴 안에서는 중복 없이 */
function draw() {
  state = store.read();
  let seen = state.seen.filter(i => i >= 0 && i < BANK.length);
  let remain = BANK.map((_, i) => i).filter(i => seen.indexOf(i) === -1);

  if (remain.length === 0) {
    state = { seen: [], cycle: state.cycle + 1 };
    store.write(state);
    seen = [];
    remain = BANK.map((_, i) => i);
  }
  startedCycle = state.cycle;
  const picked = shuffle(remain).slice(0, SIZE);
  lastOfCycle = remain.length <= SIZE;
  return picked;
}

function build(indices) {
  deck = indices.map(i => {
    const q = BANK[i];
    if (q.type === 'ox') return { ...q, _i: i };
    const order = shuffle(q.options.map((t, n) => [t, n]));
    return { ...q, _i: i, options: order.map(o => o[0]), a: order.findIndex(o => o[1] === q.a) };
  });
  idx = 0; score = 0; streak = 0; best = 0; misses = [];
  foot.style.display = '';
  $('stations').innerHTML = deck.map(() => '<div class="st"><i></i><b></b></div>').join('');
  render();
}

function paint() {
  const sts = $('stations').children;
  for (let i = 0; i < sts.length; i++) sts[i].classList.toggle('now', i === idx && !locked);
  const now = sts[idx];
  if (now && now.scrollIntoView) { try { now.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); } catch (e) {} }
  $('cnt').textContent = score + '/' + deck.length;
  $('streak').textContent = '연속 ' + streak;
}

function render() {
  locked = false;
  cur = deck[idx];
  const ox = cur.type === 'ox';
  const labels = ox ? ['O', 'X'] : cur.options;

  stage.innerHTML =
    '<div class="tag">' + (cur.tag || '정보처리기사') + '</div>' +
    '<h2 class="q">' + cur.q + '</h2>' +
    '<div class="choices ' + (ox ? 'ox' : '') + '" id="ch"></div>' +
    '<div id="vd"></div>';

  const ch = $('ch');
  labels.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = ox ? t : '<kbd>' + (i + 1) + '</kbd><span>' + t + '</span>';
    b.onclick = () => answer(i);
    ch.appendChild(b);
  });

  nextBtn.disabled = true;
  nextBtn.textContent = '답을 고르세요';
  hint.textContent = ox ? 'O / X 키로 선택, Enter로 다음' : '1~' + labels.length + ' 숫자키로 선택, Enter로 다음';
  paint();
  toTop();
}

function answer(pick) {
  if (locked) return;
  locked = true;

  const correct = cur.type === 'ox' ? (cur.a === true ? 0 : 1) : cur.a;
  const hit = pick === correct;
  const opts = $('ch').children;

  for (let i = 0; i < opts.length; i++) {
    opts[i].disabled = true;
    if (i === correct) opts[i].classList.add('right');
    else if (i === pick) opts[i].classList.add('wrong');
    else opts[i].classList.add('dim');
  }

  const st = $('stations').children[idx];
  st.classList.remove('now');
  st.classList.add(hit ? 'pass' : 'fail');

  if (hit) { score++; streak++; best = Math.max(best, streak); }
  else {
    streak = 0;
    misses.push({ q: cur.q, right: cur.type === 'ox' ? (cur.a ? 'O' : 'X') : cur.options[correct], why: cur.why, i: cur._i });
  }

  /* 푼 즉시 기록 — 중간에 창을 닫아도 진행이 남도록 */
  if (cur._i !== undefined) {
    const s = store.read();
    if (s.cycle === startedCycle && s.seen.indexOf(cur._i) === -1) {
      s.seen.push(cur._i);
      store.write(s);
    }
  }

  $('vd').innerHTML =
    '<div class="verdict ' + (hit ? 'ok' : 'no') + '">' +
    '<h3>' + (hit ? '맞았어요' : '아쉬워요') + '</h3><p>' + cur.why + '</p></div>';

  nextBtn.disabled = false;
  nextBtn.textContent = idx === deck.length - 1 ? '결과 보기' : '다음 문제';
  $('cnt').textContent = score + '/' + deck.length;
  $('streak').textContent = '연속 ' + streak;
}

function advance() {
  if (nextBtn.disabled) return;
  if (idx === deck.length - 1) return finish();
  idx++;
  render();
}

function finish() {
  foot.style.display = 'none';
  const pct = Math.round(score / deck.length * 100);
  const s = store.read();
  const done = s.cycle === startedCycle ? s.seen.length : BANK.length;
  const pctAll = Math.round(done / BANK.length * 100);

  stage.innerHTML =
    '<div class="end">' +
    '<div class="score"><b>' + pct + '</b><span>점 · ' + score + '/' + deck.length + ' · 최고 연속 ' + best + '</span></div>' +
    '<p>' + (pct === 100 ? '이번 구간은 만점이에요.' : pct >= 80 ? '거의 다 맞혔어요.' : pct >= 50 ? '절반은 잡았어요.' : '오답 노트부터 읽어보세요.') + '</p>' +

    '<div class="cycle">' +
    '<div class="cycle-top"><b>' + startedCycle + '바퀴째</b><span>' + done + ' / ' + BANK.length + '문항 · ' + pctAll + '%</span></div>' +
    '<div class="bar"><i style="width:' + pctAll + '%"></i></div>' +
    '<small>' + (lastOfCycle ? '이번 바퀴를 다 돌았어요. 다음 회차부터 ' + (startedCycle + 1) + '바퀴가 시작됩니다.' :
      '다음 회차에는 아직 안 나온 ' + (BANK.length - done) + '문항 중에서 출제돼요.') +
    (store.ok ? '' : ' (이 환경에서는 저장이 안 되니 파일을 내려받아 열면 진행이 유지됩니다)') + '</small></div>' +

    (misses.length ? '<h2>오답 노트 ' + misses.length + '</h2>' +
      misses.map(m => '<div class="miss"><h4>' + m.q + '</h4><p><b>' + m.right + '</b> — ' + m.why + '</p></div>').join('') : '') +

    '<div class="actions">' +
    (misses.length ? '<button class="next" id="again">틀린 ' + misses.length + '문제만 다시</button>' : '') +
    '<button class="ghost" id="more">다음 ' + Math.min(SIZE, Math.max(BANK.length - done, SIZE)) + '문항 이어서</button>' +
    '<a class="ghost linkbtn" href="index.html">다른 노선 고르기</a>' +
    '<button class="ghost quiet" id="reset">진행 기록 초기화</button>' +
    '</div></div>';

  if ($('again')) $('again').onclick = () => build(misses.map(m => m.i));
  $('more').onclick = () => build(draw());
  $('reset').onclick = openAdmin;
  toTop();
}

nextBtn.onclick = advance;

/* 관리자 초기화 — 비밀번호는 오조작 방지용이지 보안 장치가 아님 */
const PIN = '1111';
const mask = $('mask'), pin = $('pin'), warn = $('warn');
let modalOpen = false;

function openAdmin() {
  modalOpen = true;
  mask.hidden = false;
  pin.value = '';
  warn.textContent = '';
  pin.classList.remove('shake');
  setTimeout(() => pin.focus(), 30);
}

function closeAdmin() {
  modalOpen = false;
  mask.hidden = true;
}

function tryReset() {
  if (pin.value !== PIN) {
    warn.textContent = '비밀번호가 맞지 않습니다.';
    pin.classList.remove('shake');
    void pin.offsetWidth;
    pin.classList.add('shake');
    pin.value = '';
    pin.focus();
    return;
  }
  store.clear();
  state = { seen: [], cycle: 1 };
  closeAdmin();
  build(draw());
}

$('admin').onclick = openAdmin;
$('cancel').onclick = closeAdmin;
$('confirm').onclick = tryReset;
mask.onclick = e => { if (e.target === mask) closeAdmin(); };
pin.onkeydown = e => {
  e.stopPropagation();
  if (e.key === 'Enter') { e.preventDefault(); tryReset(); }
  if (e.key === 'Escape') closeAdmin();
};

document.addEventListener('keydown', e => {
  if (modalOpen) { if (e.key === 'Escape') closeAdmin(); return; }
  if (e.key === 'Enter' || e.key === ' ') { if (!nextBtn.disabled && foot.style.display !== 'none') { e.preventDefault(); advance(); } return; }
  if (locked || !$('ch')) return;
  const ch = $('ch').children;
  if (cur.type === 'ox') {
    if (e.key === 'o' || e.key === 'O' || e.key === 'ㅐ') answer(0);
    if (e.key === 'x' || e.key === 'X' || e.key === 'ㅌ') answer(1);
  } else {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= ch.length) answer(n - 1);
  }
});

build(draw());
</script>
</body>
</html>
